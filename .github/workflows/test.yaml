name: "CI - Test Features"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-autogenerated:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - workbench
        baseImage:
          - debian:latest
          - ubuntu:latest
          - mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - uses: actions/checkout@v4

      - name: "Install devcontainer CLI"
        run: npm install -g @devcontainers/cli@0.87.0

      - name: "Generating tests for '${{ matrix.features }}' against '${{ matrix.baseImage }}'"
        run: devcontainer features test --project-folder . --skip-scenarios -f ${{ matrix.features }} -i ${{ matrix.baseImage }}

  test-scenarios:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - workbench
    steps:
      - uses: actions/checkout@v4

      - name: "Install devcontainer CLI"
        run: npm install -g @devcontainers/cli@0.87.0

      - name: "Generating tests for '${{ matrix.features }}' scenarios"
        run: devcontainer features test --project-folder . -f ${{ matrix.features }} --skip-autogenerated --skip-duplicated
