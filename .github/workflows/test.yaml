name: "CI - Test Features"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Validate Feature metadata"
        uses: devcontainers/action@v1
        with:
          validate-only: "true"
          base-path-to-features: "./src"

      - name: "Validate Workbench files"
        run: |
          bash -n \
            .agents/skills/release-workbench/scripts/lib.sh \
            .agents/skills/release-workbench/scripts/update.sh \
            .agents/skills/release-workbench/scripts/release-notes.sh \
            .agents/skills/release-workbench/scripts/release-state.sh \
            .agents/skills/release-workbench/test/run.sh \
            test/workbench/remote_user.sh
          sh -n src/workbench/install.sh src/workbench/on-create.sh src/workbench/azure-devops-mcp.sh
          jq empty src/workbench/devcontainer-feature.json test/workbench/scenarios.json
          bash -eu -c '. src/workbench/versions.env; . src/workbench/checksums.env; test "${#DOTFILES_COMMIT}" -eq 40; test "${#DOTFILES_SHA256}" -eq 64'

      - name: "Test release mechanics"
        run: .agents/skills/release-workbench/test/run.sh

      - name: "Install devcontainer CLI"
        run: npm install -g @devcontainers/cli@0.87.0

      - name: "Test Workbench"
        run: devcontainer features test --project-folder . -f workbench --skip-autogenerated --skip-duplicated
